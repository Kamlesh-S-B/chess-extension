
<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="popup.css">
        <meta charset="UTF-8">

    </head>
<body>
    <div id="home">
        <div id = "container">
            <h1 class="header">🌱 ChessGrowth </h1>
            <input type = "text" id="username-input" value =""> 
        </div>
        

        <p id="tree-level" class="tree-text"></p>
        
        
        <img id="tree-image" src="">
        

        <p id="total-games" class="stats-text"></p>
        <p id="games-won" class="stats-text"></p>
        <p id="games-lost" class="stats-text"></p>
        <p id="games-drawn" class="stats-text"></p>
         <div id="progress-bar">
        <div id="progress-fill"></div>
        </div>


        <p id="games-to-next" class="tree-text">Loading...</p>

    
    </div>

    
    

    <div id="badges-page">
        
        <h2 class = "header">BADGES</h2>
        <div id="badges-container">


        <p id = "first-game-badge" class = "badge">🔒 First Game</p>



        <p id = "twenty-games-badge" class = "badge">🔒 20 Games</p>
        <p id = "seventy-five-games-badge" class = "badge">🔒 75 Games</p>
        <p id = "two-hundred-games-badge" class = "badge">🔒 200 Games</p>
        <p id = "fifty-wins-badge" class = "badge" >🔒 50 Wins</p>
        <p id = "sixty-percent-win-rate-badge" class = "badge" >🔒 60% WR</p>
        <p id = "forest-badge" class = "badge">🔒 Forest</p>
        </div>






    </div>

    <div id="button-container">
        <button id="to-home-button">HOME</button>
        <button id="to-badges-button">BADGES</button>
    </div>
    

    <script src="popup.js"></script>
</body>
</html>
